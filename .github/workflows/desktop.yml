name: Desktop apps

# Builds the Windows, macOS and Linux installers.
# Every push uploads them to the workflow run (Actions tab > run > Artifacts).
# A GitHub Release with the installers is published when a tag like v1.0.0 is pushed,
# or when the workflow is run by hand (Actions > Desktop apps > Run workflow) with a version.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Publish a release with this version tag (for example v1.0.0). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            files: dist/*.exe
            name: RollScout-Windows
          - os: macos-latest
            target: --mac
            files: dist/*.dmg
            name: RollScout-macOS
          - os: ubuntu-latest
            target: --linux
            files: dist/*.AppImage
            name: RollScout-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build installer
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # No paid code-signing certificate is configured, so builds are unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag' || inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          target_commitish: ${{ github.sha }}
          name: RollScout ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          body: |
            Download the installer for your computer below.

            - **Windows:** `RollScout-Setup-*.exe`. If SmartScreen appears, click *More info* then *Run anyway*.
            - **Mac with Apple Silicon (M1 or newer):** `RollScout-*-arm64.dmg`
            - **Mac with Intel:** `RollScout-*-x64.dmg`
            - **Linux:** `RollScout-*.AppImage`

            On a Mac, drag RollScout into Applications, then right-click it and choose *Open* the first time. If macOS says it is damaged, run `xattr -cr /Applications/RollScout.app` in Terminal.
          files: dist/*
