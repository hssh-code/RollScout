name: Desktop apps

# Builds the Windows, macOS and Linux installers.
# Every push uploads them to the workflow run (Actions tab > run > Artifacts).
# Pushing a tag like v1.0.0 also publishes them on a GitHub Release.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            files: dist/*.exe
            name: RollScout-Windows
          - os: macos-latest
            target: --mac
            files: dist/*.dmg
            name: RollScout-macOS
          - os: ubuntu-latest
            target: --linux
            files: dist/*.AppImage
            name: RollScout-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build installer
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # No paid code-signing certificate is configured, so builds are unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
